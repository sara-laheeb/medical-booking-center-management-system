<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام الحجوزات | Booking System</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <h1>نظام الحجوزات</h1>
            <p>Booking System — حجز الموارد بسهولة</p>
        </div>
    </header>

    <main class="container">
        <section class="card" id="booking-form-section">
            <h2>حجز جديد</h2>
            <form id="booking-form">
                <div class="grid">
                    <label>
                        الاسم
                        <input type="text" id="name" required minlength="2" placeholder="اسم العميل">
                    </label>
                    <label>
                        البريد الإلكتروني
                        <input type="email" id="email" placeholder="optional@email.com">
                    </label>
                    <label>
                        المورد
                        <select id="resource_id" required></select>
                    </label>
                    <label>
                        التاريخ
                        <input type="date" id="booking_date" required>
                    </label>
                    <label>
                        وقت البداية
                        <input type="time" id="start_time" value="09:00" required>
                    </label>
                    <label>
                        وقت النهاية
                        <input type="time" id="end_time" value="10:00" required>
                    </label>
                </div>
                <label>
                    ملاحظات
                    <textarea id="notes" rows="2" placeholder="ملاحظات اختيارية"></textarea>
                </label>
                <button type="submit" class="btn primary">إنشاء الحجز</button>
            </form>
            <div id="form-message" class="message hidden"></div>
        </section>

        <section class="card">
            <div class="section-header">
                <h2>الحجوزات</h2>
                <div class="filters">
                    <select id="filter-status">
                        <option value="">كل الحالات</option>
                        <option value="pending">pending</option>
                        <option value="confirmed">confirmed</option>
                        <option value="cancelled">cancelled</option>
                    </select>
                    <input type="date" id="filter-date">
                    <select id="filter-resource">
                        <option value="">كل الموارد</option>
                    </select>
                    <input type="search" id="filter-search" placeholder="بحث بالاسم أو البريد">
                    <button type="button" class="btn" id="apply-filters">تطبيق</button>
                </div>
            </div>
            <div id="bookings-list" class="bookings-list"></div>
            <div id="pagination" class="pagination"></div>
        </section>

        <section class="card">
            <h2>الموارد المتاحة</h2>
            <div id="resources-list" class="resources-grid"></div>
        </section>
    </main>

    <footer class="footer">
        <div class="container">Booking System API v1</div>
    </footer>

    <script src="/js/app.js"></script>
</body>
</html>
